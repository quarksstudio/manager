name: Publish NPM packages

on:
  push:
    tags:
      - 'manager-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and pack without publishing
        type: boolean
        default: true
      version:
        description: Version to set on all publishable packages (e.g. 0.1.0 or 0.2.0-beta)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release commit belongs to main
        run: git merge-base --is-ancestor HEAD origin/main

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: npm install --global npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:package-architecture
      - name: Reject generated JavaScript in source directories
        run: test -z "$(find apps packages -type f -path '*/src/*' \( -name '*.js' -o -name '*.js.map' \) -print -quit)"
      - name: Resolve release version
        id: version
        env:
          RELEASE_REF: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: node tools/resolve-release-version.mjs
      - run: pnpm format:check
      - run: pnpm exec nx run-many -t lint test build --all
      - run: pnpm test:web-artifacts
      - name: Apply release version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node tools/set-release-version.mjs "$RELEASE_VERSION"
      - run: node tools/prepare-npm-packages.mjs
      - name: Pack or publish in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node tools/publish-npm-packages.mjs --dry-run
          else
            node tools/publish-npm-packages.mjs
          fi
